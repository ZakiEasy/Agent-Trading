services:
  - type: web
    name: agent-trading
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 5000
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME_WATCHLIST
        value: "Suivi d'Investissement"
      - key: GOOGLE_SHEET_NAME_SIGNALS
        value: "Signaux"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SUPABASE_PROJECT_REF
        value: "wszevrqncyusohdmiswe"
      - key: SUPABASE_URL
        value: "https://wszevrqncyusohdmiswe.supabase.co"
      - key: SUPABASE_DB_HOST
        value: "db.wszevrqncyusohdmiswe.supabase.co"
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: "postgres"
      - key: SUPABASE_DB_USER
        value: "postgres"
      - key: SUPABASE_DB_PASSWORD
        sync: false
