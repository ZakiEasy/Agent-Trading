version: '3.8'

services:
  db:
    image: postgres:16
    container_name: agent_trading_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_trading_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: agent_trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    container_name: agent_trading_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=agent_trading_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=agent_trading
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  robot:
    build: .
    container_name: agent_trading_robot
    restart: unless-stopped
    command: ["python", "robot_worker.py"]
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=agent_trading_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=agent_trading
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: agent_trading_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
